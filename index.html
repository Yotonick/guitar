<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b1613">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Гриф</title>
  <link rel="preload" href="fonts/fira-sans-extra-condensed-cyrillic-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/golos-text-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
</head>
<body>
<div id="app">
  <main>
    <!-- ТЮНЕР -->
    <section id="view-tuner" class="view active">
      <header class="top">
        <h1>Тюнер</h1>
        <div class="top-actions">
          <button id="btn-gauge" class="icon-btn" aria-label="Вид шкалы" title="Дуга или линейка">
            <svg viewBox="0 0 24 24" class="ic"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l3-4"/></svg>
          </button>
          <button id="btn-tuning" class="pill"><span id="tuning-name">Стандарт (E)</span><svg viewBox="0 0 24 24" class="ic sm"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
      </header>
      <div class="tuner-body">
        <div class="gauge-wrap">
          <div class="note-readout">
            <div id="note-big" class="idle">—</div>
            <div id="note-hint" class="hint">&nbsp;</div>
          </div>

          <svg id="gauge" class="gauge-arc" viewBox="0 0 300 162" aria-hidden="true">
            <path id="gauge-arc" class="g-arc"/>
            <path id="gauge-zone" class="g-zone"/>
            <g id="gauge-ticks"></g>
            <g id="needle"><line x1="150" y1="150" x2="150" y2="40" class="g-needle"/><circle cx="150" cy="150" r="5" class="g-hub"/></g>
            <text class="g-label">♭</text>
            <text class="g-label" text-anchor="end">♯</text>
          </svg>

          <svg id="gauge-line" class="gauge-line" viewBox="0 0 320 64" aria-hidden="true">
            <rect x="148" y="10" width="24" height="36" rx="3" class="gl-zone"/>
            <g id="gl-ticks"></g>
            <g id="gl-marker"><path d="M160 4 L160 52" class="gl-needle"/><circle cx="160" cy="56" r="4" class="gl-dot"/></g>
            <text x="8" y="34" class="g-label">♭</text>
            <text x="312" y="34" class="g-label" text-anchor="end">♯</text>
          </svg>

          <div id="note-hz">Сыграй открытую струну</div>
        </div>

        <div class="seg" id="tuner-mode">
          <button data-mode="strings" class="on">По струнам</button>
          <button data-mode="chromatic">Хроматический</button>
        </div>
        <div id="strings" class="strings"></div>
        <div id="tuned-count" class="muted center small"></div>
      </div>
      <div class="bottom-action">
        <button id="btn-listen" class="primary big">Слушать</button>
      </div>
    </section>

    <!-- ПЕСНИ -->
    <section id="view-songs" class="view">
      <header class="top">
        <h1>Песни</h1>
        <button id="btn-settings" class="icon-btn" aria-label="Настройки"><svg viewBox="0 0 24 24" class="ic"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      </header>
      <div class="scroll">
        <form id="search-form" class="search">
          <svg viewBox="0 0 24 24" class="ic sm"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search-input" type="search" placeholder="Исполнитель или песня" autocomplete="off" enterkeyhint="search">
        </form>
        <div class="seg small-seg" id="songs-seg">
          <button data-tab="fav" class="on">Избранное</button>
          <button data-tab="recent">Недавние</button>
        </div>
        <div id="songs-content"></div>
        <label class="file-btn">
          <input id="file-input" type="file" accept=".gp,.gp3,.gp4,.gp5,.gpx,.musicxml,.xml,.mxl,.tex" hidden>
          Открыть свой файл Guitar Pro
        </label>
      </div>
    </section>

    <!-- ПЛЕЕР -->
    <section id="view-player" class="view">
      <header class="top player-top">
        <div class="titles">
          <div id="song-title" class="song-title">Ничего не открыто</div>
          <div id="song-sub" class="song-sub"></div>
        </div>
        <button id="btn-fav" class="icon-btn" aria-label="В избранное"><svg viewBox="0 0 24 24" class="ic"><path d="M12 20s-7-4.4-9.2-8.7C1.3 8.3 3.2 5 6.4 5c2 0 3.4 1.1 4.1 2.3h3C14.2 6.1 15.6 5 17.6 5c3.2 0 5.1 3.3 3.6 6.3C19 15.6 12 20 12 20z"/></svg></button>
      </header>
      <div id="viewport" class="viewport">
        <div id="empty-player" class="empty">
          <div class="empty-frets"><i></i><i></i><i></i><i></i></div>
          <p>Найди песню во вкладке «Песни»<br>или сгенерируй рифф</p>
        </div>
        <div id="at"></div>
        <div id="loader" class="loader hidden"><div class="spin"></div><span id="loader-text">Загрузка…</span></div>
      </div>
      <div class="controls" id="controls">
        <div class="seek">
          <span id="t-cur">0:00</span>
          <input id="seek" class="filled" type="range" min="0" max="1000" value="0" aria-label="Позиция">
          <span id="t-end">0:00</span>
        </div>
        <div class="ctrl-row">
          <button id="btn-tracks" class="side-btn" aria-label="Дорожки">
            <svg viewBox="0 0 24 24" class="ic"><path d="M5 5v14M10 8v8M15 4v16M20 9v6"/></svg><span>Дорожки</span>
          </button>
          <button id="btn-loop" class="icon-btn" aria-label="Цикл"><svg viewBox="0 0 24 24" class="ic"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg></button>
          <button id="btn-play" class="play" aria-label="Играть" disabled></button>
          <button id="btn-stop" class="icon-btn" aria-label="В начало"><svg viewBox="0 0 24 24" class="ic"><path d="M6 5v14"/><path d="M19 5l-10 7 10 7z"/></svg></button>
          <button id="btn-sound" class="side-btn" aria-label="Звук">
            <svg viewBox="0 0 24 24" class="ic"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M8 9l1.6-1.6M16 9l-1.2-1.8"/><path d="M4 17h16"/><circle cx="12" cy="17" r="1" class="fill"/></svg><span>Звук</span>
          </button>
        </div>
        <div class="chips" id="chips">
          <div class="speed" id="speed-chips" role="group" aria-label="Скорость">
            <button data-v="0.4">40</button><button data-v="0.6">60</button><button data-v="0.8">80</button><button data-v="1" class="on">100%</button>
          </div>
          <button id="chip-metro" class="chip">Метроном</button>
          <button id="chip-count" class="chip">Отсчёт</button>
          <button id="chip-trainer" class="chip">Тренер</button>
          <button id="chip-view" class="chip">Табы</button>
          <button id="chip-vary" class="chip hidden">Вариация</button>
          <button id="chip-lead" class="chip hidden">Другое соло</button>
          <button id="chip-dice" class="chip hidden">Ещё рифф</button>
        </div>
      </div>
    </section>

    <!-- РИФФ -->
    <section id="view-riff" class="view">
      <header class="top"><h1>Рифф</h1></header>
      <div class="scroll">
        <div id="riff-mode" class="seg riff-mode">
          <button data-v="ai" class="on">ИИ: учится на песнях</button>
          <button data-v="simple">Простой</button>
        </div>
        <div id="genres" class="genres"></div>
        <form id="style-form" class="search style-q">
          <input id="style-input" type="text" placeholder="Свой стиль: «грув», «Deftones, Tool»…" autocomplete="off" enterkeyhint="go">
          <button type="submit" class="chip">Выбрать</button>
        </form>
        <div id="ai-status" class="ai-status"></div>
        <div id="riff-what" class="seg riff-mode">
          <button data-v="riff" class="on">Рифф</button>
          <button data-v="solo">Рифф + соло</button>
          <button data-v="melody">Мелодия</button>
        </div>

        <div class="fields">
          <div class="row-field">
            <div class="rf-name">Темп <span class="muted" id="tempo-val">авто</span></div>
            <input id="tempo" type="range" min="50" max="210" value="100" aria-label="Темп">
            <button id="tempo-auto" class="chip on">Авто</button>
          </div>
          <div class="row-field">
            <div class="rf-name">Тактов</div>
            <div class="speed" id="bars-chips"><button data-v="4" class="on">4</button><button data-v="8">8</button></div>
          </div>
          <div class="row-field">
            <div class="rf-name">Строй</div>
            <button id="riff-tuning" class="pill">Как в жанре</button>
          </div>
          <div class="row-field">
            <div class="rf-name">Бас и ударные</div>
            <button id="riff-drums" class="chip on">Вкл</button>
          </div>
        </div>

        <button id="btn-generate" class="primary big">Сочинить рифф</button>
        <div id="train-progress" class="train-progress hidden"><i></i></div>

        <h2 class="sub-h" id="similar-h">Похожие песни на Songsterr</h2>
        <div id="similar"></div>
      </div>
    </section>
  </main>

  <nav id="tabbar">
    <button data-view="tuner" class="on"><i class="inlay"></i><span>Тюнер</span></button>
    <button data-view="songs"><i class="inlay"></i><span>Песни</span></button>
    <button data-view="player"><i class="inlay"></i><span>Плеер</span></button>
    <button data-view="riff"><i class="inlay"></i><span>Рифф</span></button>
  </nav>
</div>

<div id="sheet-bg" class="sheet-bg hidden"></div>
<div id="sheet" class="sheet hidden" role="dialog"><div class="grab"></div><h2 id="sheet-title"></h2><div id="sheet-body"></div></div>
<div id="toast" class="toast hidden" role="status"></div>

<script src="vendor/alphatab/alphaTab.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
