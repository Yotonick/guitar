# Деплой сайта на GitHub Pages с увеличенным временем ожидания.
# Стандартный деплой сдаётся через 10 минут, а с тяжёлыми саундфонтами
# GitHub иногда раскладывает файлы дольше. Здесь ждём до 30 минут.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Собрать сайт без лишнего
        run: |
          mkdir _site
          cp -r index.html config.js css js fonts vendor _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
